name: "Meta Reports Yesterday"
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma or space-separated ISO2 countries, or ALL"
        required: false
        default: "ALL"
      start_date:
        description: "First reportDS date (YYYY-MM-DD); default today - 14"
        required: false
        default: ""
      end_date:
        description: "Last reportDS date (YYYY-MM-DD); default today - 2"
        required: false
        default: ""
      max_downloads:
        description: "Optional cap for a test/backfill run"
        required: false
        default: ""

jobs:
  update-meta-reports:
    name: Update Meta Reports
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ github.token }}
      REPORT_COUNTRIES: ${{ inputs.countries || 'ALL' }}
      REPORT_TIME_PRESETS: yesterday
      REPORT_START_DATE: ${{ inputs.start_date || '' }}
      REPORT_END_DATE: ${{ inputs.end_date || '' }}
      REPORT_MAX_DOWNLOADS: ${{ inputs.max_downloads || '' }}
    steps:
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Setup - Checkout repo
        uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::pacman
            any::dplyr
            any::fs
            any::gh
            any::glue
            any::httr
            any::janitor
            any::jsonlite
            any::lubridate
            any::piggyback
            any::purrr
            any::readr
            any::stringr
            any::tibble
            any::tidyr
            any::vroom
      - name: Download and publish reports
        run: Rscript 'manual_backfill_reports.R'
